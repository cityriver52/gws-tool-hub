<style>
  .initial-loading-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 22% 18%, rgba(47, 111, 237, 0.10), transparent 24rem),
      radial-gradient(circle at 82% 30%, rgba(126, 87, 194, 0.08), transparent 22rem),
      #f7f9fd;
  }

  .initial-loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: #52627c;
    text-align: center;
  }

  .initial-loading-mark {
    display: grid;
    grid-template-columns: repeat(2, 10px);
    gap: 4px;
    padding: 13px;
    border-radius: 16px;
    background: #2f6fed;
    box-shadow: 0 14px 34px rgba(47, 111, 237, 0.24);
  }

  .initial-loading-mark span {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: #fff;
    animation: initial-loading-pulse 1.15s ease-in-out infinite;
  }

  .initial-loading-mark span:nth-child(2) { animation-delay: .12s; opacity: .78; }
  .initial-loading-mark span:nth-child(3) { animation-delay: .24s; opacity: .58; }
  .initial-loading-mark span:nth-child(4) { animation-delay: .36s; opacity: .9; }

  .initial-loading-title {
    margin: 4px 0 0;
    color: #26344d;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .12em;
  }

  .initial-loading-text {
    margin: 0;
    font-size: 13px;
  }

  .app-shell {
    visibility: hidden;
  }

  .app-shell.is-ready {
    visibility: visible;
    animation: app-shell-reveal .18s ease-out both;
  }

  .initial-load-error {
    max-width: 560px;
    padding: 22px 24px;
    border: 1px solid #f0c8c4;
    border-radius: 16px;
    background: #fff;
    color: #b42318;
    box-shadow: 0 12px 30px rgba(35, 48, 77, 0.08);
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
  }

  @keyframes initial-loading-pulse {
    0%, 100% { transform: scale(.86); opacity: .55; }
    50% { transform: scale(1); opacity: 1; }
  }

  @keyframes app-shell-reveal {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
