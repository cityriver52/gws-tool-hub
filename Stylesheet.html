<style>
  :root {
    --background: #f7f8fa;
    --surface: #ffffff;
    --surface-hover: #fafbfc;
    --text: #202124;
    --text-subtle: #5f6368;
    --border: #dadce0;
    --accent: #1a73e8;
    --accent-light: #e8f0fe;
    --tag-bg: #f1f3f4;
    --shadow: 0 1px 2px rgba(60, 64, 67, 0.15), 0 1px 3px 1px rgba(60, 64, 67, 0.08);
    --shadow-hover: 0 2px 6px rgba(60, 64, 67, 0.18), 0 4px 12px rgba(60, 64, 67, 0.10);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }

  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 22px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--text-subtle);
    font-size: 14px;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  .search-area { margin-bottom: 26px; }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.12);
  }

  .search-icon { padding-left: 18px; font-size: 18px; }

  #searchInput {
    width: 100%;
    padding: 16px 44px 16px 12px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 17px;
  }

  .clear-button {
    position: absolute;
    right: 10px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-subtle);
    font-size: 22px;
    cursor: pointer;
  }

  .clear-button:hover { background: var(--tag-bg); }

  .tag-area {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }

  .tag-button {
    padding: 7px 13px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .tag-button:hover { background: #e5e7e9; }

  .tag-button.active {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    color: var(--text-subtle);
    font-size: 13px;
  }

  .text-button {
    border: none;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  .catalog-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 260px;
    padding: 22px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .catalog-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    background: var(--surface-hover);
  }

  .card-title {
    margin: 0 0 10px;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 700;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .card-description {
    margin: 0 0 18px;
    color: #3c4043;
    font-size: 14px;
    line-height: 1.75;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: auto;
    min-width: 0;
  }

  .card-tag {
    max-width: 100%;
    padding: 4px 8px;
    border: none;
    border-radius: 6px;
    background: var(--tag-bg);
    color: var(--text-subtle);
    font-size: 11px;
    cursor: pointer;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .card-tag:hover {
    background: var(--accent-light);
    color: var(--accent);
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #eceff1;
    min-width: 0;
  }

  .card-date { color: var(--text-subtle); font-size: 11px; }

  .chat-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  .chat-link:hover { text-decoration: underline; }

  .loading, .empty-state {
    padding: 70px 20px;
    text-align: center;
    color: var(--text-subtle);
  }

  .spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 14px;
    border: 3px solid #e0e0e0;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-icon { font-size: 40px; }

  .empty-state h2 {
    margin: 8px 0 0;
    color: var(--text);
    font-size: 18px;
  }

  .empty-state p { margin-top: 4px; font-size: 13px; }

  .error-area {
    margin-top: 20px;
    padding: 16px;
    background: #fce8e6;
    border-radius: 8px;
    color: #b3261e;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .header-inner { padding: 20px 16px; }
    .container { padding: 20px 14px 60px; }
    h1 { font-size: 23px; }
    .catalog-grid { grid-template-columns: 1fr; }
  }
</style>
