<body>
  <header class="app-header">
    <div class="hero-shell">
      <div class="hero-card">
        <div class="hero-decoration hero-decoration-one"></div>
        <div class="hero-decoration hero-decoration-two"></div>
        <div class="hero-decoration hero-decoration-three"></div>

        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="brand-label">GWS TOOL HUB</span>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">COLLECT · DISCOVER · REUSE</p>
          <h1>仕事をちょっと楽にする<br class="desktop-break">アイデアを見つけよう。</h1>
          <p class="subtitle">このスペースで共有されたGoogle Workspaceの便利な使い方を、検索・タグからすぐ探せます。</p>
        </div>

        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            type="search"
            placeholder="何を楽にしたいですか？"
            autocomplete="off"
          >
          <button
            id="clearSearchButton"
            class="clear-button"
            type="button"
            aria-label="検索をクリア"
          >×</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filter-panel">
      <div class="filter-heading">
        <div>
          <p class="section-kicker">BROWSE BY TAG</p>
          <h2 class="section-title">タグから眺める</h2>
        </div>
        <button
          id="clearFiltersButton"
          class="text-button hidden"
          type="button"
        >絞り込みを解除</button>
      </div>
      <div id="tagArea" class="tag-area"></div>
    </section>

    <div class="result-header">
      <div>

        <span class="sort-label">最終更新が新しい順</span>

      <div class="spinner"></div>
      <p>カタログを読み込んでいます</p>
    </div>

    <div id="errorArea" class="error-area hidden"></div>
    <div id="catalogGrid" class="catalog-grid hidden"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">⌕</div>
      <h2>見つかりませんでした</h2>
      <p>検索ワードやタグを変えてみてください。</p>
