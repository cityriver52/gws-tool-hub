<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1>GWS Tool Hub</h1>
      <p class="subtitle">みんなが見つけた便利な使い方を探してみよう</p>
    </div>
  </header>

  <main class="container">
    <section class="search-area">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          id="searchInput"
          type="search"
          placeholder="何を楽にしたいですか？"
          autocomplete="off"
        >
        <button
          id="clearSearchButton"
          class="clear-button"
          type="button"
          aria-label="検索をクリア"
        >×</button>
      </div>

      <div id="tagArea" class="tag-area"></div>
    </section>

    <div class="result-header">
      <span id="resultCount">読み込み中...</span>
      <button
        id="clearFiltersButton"
        class="text-button hidden"
        type="button"
      >絞り込みを解除</button>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>カタログを読み込んでいます</p>
    </div>

    <div id="errorArea" class="error-area hidden"></div>
    <div id="catalogGrid" class="catalog-grid hidden"></div>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">🔎</div>
      <h2>見つかりませんでした</h2>
      <p>検索ワードやタグを変えてみてください。</p>
    </div>
  </main>

  <?!= include('JavaScript'); ?>
</body>
</html>
