<script>
  let catalogItems = [];
  let allTags = [];
  let lastRandomDiscoveryThreadIds = new Set();
  let dailyDiscoveryThreadIds = new Set();
  const selectedTags = new Set();

  window.addEventListener('DOMContentLoaded', initialize);

  function initialize() {
    setupEvents();
    loadCatalog();
  }

  function setupEvents() {
    document
      .getElementById('searchInput')
      .addEventListener('input', renderCatalog);

    document
      .getElementById('clearSearchButton')
      .addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        renderCatalog();
      });

    document
      .getElementById('clearFiltersButton')
      .addEventListener('click', clearFilters);

    document
      .getElementById('surpriseButton')
      .addEventListener('click', showRandomDiscovery);
  }

  function loadCatalog() {
    google.script.run
      .withSuccessHandler(onCatalogLoaded)
      .withFailureHandler(onCatalogError)
      .getCatalogData();
  }

  function onCatalogLoaded(data) {
    catalogItems = data.items || [];
    allTags = data.tags || [];

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('catalogGrid').classList.remove('hidden');

    const generatedAt = document.getElementById('generatedAt');
    generatedAt.textContent = data.generatedAt
      ? `表示更新 ${data.generatedAt}`
      : '';

    renderDailyDiscovery();
    renderTagButtons();
    renderCatalog();
  }

  function onCatalogError(error) {
    document.getElementById('loading').classList.add('hidden');

    const area = document.getElementById('errorArea');
    area.textContent =
      'カタログを読み込めませんでした。\n' +
      (error.message || String(error));
    area.classList.remove('hidden');
  }

  function renderDailyDiscovery() {
    const section = document.getElementById('dailyDiscovery');
    const grid = document.getElementById('dailyDiscoveryGrid');
    grid.innerHTML = '';

    if (catalogItems.length === 0) {
      dailyDiscoveryThreadIds = new Set();
      section.classList.add('hidden');
      return;
    }

    const picks = getDailyPicks_(catalogItems);
    dailyDiscoveryThreadIds = new Set(picks.map(pick => pick.item.threadId));

    picks.forEach(pick => {
      grid.appendChild(
        createCard(pick.item, {
          discovery: true,
          badge: pick.badge,
          modifier: pick.modifier
        })
      );
    });

    section.classList.remove('hidden');
  }

  function getDailyPicks_(items) {
    if (items.length === 0) return [];

    const dateKey = getJapanDateKey_();
    const selectedIds = new Set();
    const picks = [];

    // 1件目: 最終更新が最も新しいもの。
    const newest = items[0];
    if (newest) {
      selectedIds.add(newest.threadId);
      picks.push({
        item: newest,
        badge: '新着から1件',
        modifier: 'pick-new'
      });
    }

    // 2件目: 古い半分から日替わりで1件。埋もれた投稿を再浮上させる。
    const remainingForOld = items.filter(item => !selectedIds.has(item.threadId));
    const oldPoolSize = Math.max(1, Math.ceil(remainingForOld.length / 2));
    const oldPool = remainingForOld
      .slice()
      .sort((a, b) => a.firstPostTimestamp - b.firstPostTimestamp)
      .slice(0, oldPoolSize);

    if (oldPool.length > 0) {
      const oldIndex = seededIndex_(dateKey + ':rediscover', oldPool.length);
      const oldPick = oldPool[oldIndex];
      selectedIds.add(oldPick.threadId);
      picks.push({
        item: oldPick,
        badge: '掘り起こし',
        modifier: 'pick-rediscover'
      });
    }

    // 3件目: 残りから日付をseedにしたランダム1件。同じ日は全員同じ結果になる。
    const randomPool = items.filter(item => !selectedIds.has(item.threadId));
    if (randomPool.length > 0) {
      const randomIndex = seededIndex_(dateKey + ':random', randomPool.length);
      const randomPick = randomPool[randomIndex];
      picks.push({
        item: randomPick,
        badge: '今日のランダム',
        modifier: 'pick-random'
      });
    }

    return picks;
  }

  function getJapanDateKey_() {
    const parts = new Intl.DateTimeFormat('en', {
      timeZone: 'Asia/Tokyo',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(new Date());

    const values = {};
    parts.forEach(part => {
      if (part.type !== 'literal') values[part.type] = part.value;
    });

    return `${values.year}-${values.month}-${values.day}`;
  }

  function seededIndex_(seed, length) {
    if (length <= 1) return 0;

    let hash = 2166136261;
    for (let i = 0; i < seed.length; i++) {
      hash ^= seed.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }

    return (hash >>> 0) % length;
  }

  function showRandomDiscovery() {
    if (catalogItems.length === 0) return;

    // まずは「今日の3件」と直前に表示したランダム3件を除外する。
    let candidates = catalogItems.filter(item =>
      !dailyDiscoveryThreadIds.has(item.threadId) &&
      !lastRandomDiscoveryThreadIds.has(item.threadId)
    );

    // 3件に足りない場合は、直前の3件を候補へ戻す。
    if (candidates.length < 3) {
      candidates = catalogItems.filter(item =>
        !dailyDiscoveryThreadIds.has(item.threadId)
      );
    }

    // それでも足りない場合は全件から選ぶ。
    if (candidates.length < 3) {
      candidates = catalogItems.slice();
    }

    const picks = sampleRandomItems_(candidates, Math.min(3, candidates.length));
    lastRandomDiscoveryThreadIds = new Set(picks.map(item => item.threadId));

    const grid = document.getElementById('surpriseGrid');
    grid.innerHTML = '';

    picks.forEach(item => {
      grid.appendChild(
        createCard(item, {
          discovery: true,
          badge: 'ランダム',
          modifier: 'pick-surprise'
        })
      );
    });

    const area = document.getElementById('surpriseArea');
    area.classList.remove('hidden');
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function sampleRandomItems_(items, count) {
    const pool = items.slice();

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    return pool.slice(0, count);
  }

  function renderTagButtons() {
    const area = document.getElementById('tagArea');
    area.innerHTML = '';

    allTags.forEach(tag => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tag-button';
      button.textContent = '#' + tag;
      button.addEventListener('click', () => toggleTag(tag, button));
      area.appendChild(button);
    });
  }

  function toggleTag(tag, button) {
    if (selectedTags.has(tag)) {
      selectedTags.delete(tag);
      button.classList.remove('active');
    } else {
      selectedTags.add(tag);
      button.classList.add('active');
    }
    renderCatalog();
  }

  function selectTag(tag) {
    selectedTags.add(tag);

    document.querySelectorAll('.tag-button').forEach(button => {
      const buttonTag = button.textContent.replace(/^#/, '');
      button.classList.toggle('active', selectedTags.has(buttonTag));
    });

    document.querySelector('.filter-panel')?.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
    renderCatalog();
  }

  function renderCatalog() {
    const query = normalizeText(document.getElementById('searchInput').value);

    const filtered = catalogItems.filter(item => {
      if (query && !normalizeText(item.searchText).includes(query)) {
        return false;
      }

      if (selectedTags.size > 0) {
        const itemTags = new Set(item.tags);
        for (const tag of selectedTags) {
          if (!itemTags.has(tag)) return false;
        }
      }

      return true;
    });

    drawCards(filtered);
    updateResultHeader(filtered.length);
  }

  function normalizeText(value) {
    return String(value || '').normalize('NFKC').toLowerCase().trim();
  }

  function drawCards(items) {
    const grid = document.getElementById('catalogGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = '';

    if (items.length === 0) {
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
      return;
    }

    empty.classList.add('hidden');
    grid.classList.remove('hidden');

    items.forEach(item => grid.appendChild(createCard(item)));
  }

  function createCard(item, options = {}) {
    const card = document.createElement('article');
    card.className = 'catalog-card';

    if (options.discovery) {
      card.classList.add('discovery-card');
    }
    if (options.modifier) {
      card.classList.add(options.modifier);
    }

    if (options.badge) {
      const badge = document.createElement('div');
      badge.className = 'discovery-badge';
      badge.textContent = options.badge;
      card.appendChild(badge);
    }

    const title = document.createElement('h2');
    title.className = 'card-title';
    title.textContent = item.title;
    card.appendChild(title);

    const description = document.createElement('p');
    description.className = 'card-description';
    description.textContent = item.description;
    card.appendChild(description);

    if (item.tags.length > 0) {
      const tagArea = document.createElement('div');
      tagArea.className = 'card-tags';

      item.tags.forEach(tag => {
        const tagButton = document.createElement('button');
        tagButton.type = 'button';
        tagButton.className = 'card-tag';
        tagButton.textContent = '#' + tag;
        tagButton.addEventListener('click', () => selectTag(tag));
        tagArea.appendChild(tagButton);
      });

      card.appendChild(tagArea);
    }

    const footer = document.createElement('div');
    footer.className = 'card-footer';

    const date = document.createElement('span');
    date.className = 'card-date';
    date.textContent = item.lastUpdatedAt
      ? `更新 ${item.lastUpdatedAt}`
      : `投稿 ${item.firstPostAt}`;
    footer.appendChild(date);

    if (item.chatUrl) {
      const link = document.createElement('a');
      link.className = 'chat-link';
      link.href = item.chatUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'Chatで見る →';
      footer.appendChild(link);
    }

    card.appendChild(footer);
    return card;
  }

  function updateResultHeader(count) {
    document.getElementById('resultCount').textContent = `${count}件の活用アイデア`;

    const hasFilter =
      selectedTags.size > 0 ||
      document.getElementById('searchInput').value.trim() !== '';

    document
      .getElementById('clearFiltersButton')
      .classList.toggle('hidden', !hasFilter);
  }

  function clearFilters() {
    selectedTags.clear();
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.tag-button').forEach(button => {
      button.classList.remove('active');
    });
    renderCatalog();
  }
</script>
