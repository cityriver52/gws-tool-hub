<style>
  .discovery-section {
    margin-bottom: 42px;
    padding: 26px;
    background:
      radial-gradient(circle at 92% 10%, rgba(255, 203, 71, 0.18), transparent 18rem),
      linear-gradient(135deg, rgba(255,255,255,0.96), rgba(244,248,255,0.94));
    border: 1px solid #dbe4f2;
    border-radius: 24px;
    box-shadow: 0 16px 42px rgba(35, 48, 77, 0.08);
  }

  .discovery-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-bottom: 20px;
  }

  .discovery-title,
  .catalog-section-title {
    margin: 3px 0 0;
    color: var(--text);
    font-size: 24px;
    line-height: 1.3;
    letter-spacing: -0.025em;
  }

  .discovery-lead,
  .catalog-section-lead {
    margin: 7px 0 0;
    color: var(--text-subtle);
    font-size: 13px;
  }

  .surprise-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    flex: 0 0 auto;
    padding: 10px 14px;
    border: 1px solid #cbd9f5;
    border-radius: 12px;
    background: #ffffff;
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 5px 14px rgba(42, 74, 137, 0.08);
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .surprise-button span {
    font-size: 17px;
    transition: transform 0.25s ease;
  }

  .surprise-button:hover {
    background: var(--accent-light);
    box-shadow: 0 8px 18px rgba(42, 74, 137, 0.13);
    transform: translateY(-1px);
  }

  .surprise-button:hover span { transform: rotate(90deg); }

  .discovery-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .discovery-card {
    min-height: 300px;
    padding-top: 22px;
    box-shadow: 0 10px 26px rgba(35, 48, 77, 0.07);
  }

  .discovery-card::before { height: 6px; }

  .discovery-card.pick-new::before {
    background: linear-gradient(90deg, #2f6fed, #47a2ff);
  }

  .discovery-card.pick-rediscover::before {
    background: linear-gradient(90deg, #9b6cf0, #ef79b2);
  }

  .discovery-card.pick-random::before {
    background: linear-gradient(90deg, #f59e0b, #f97316);
  }

  .discovery-card.pick-surprise::before {
    background: linear-gradient(90deg, #10b981, #2f6fed, #8b5cf6);
  }

  .discovery-badge {
    align-self: flex-start;
    margin-bottom: 13px;
    padding: 5px 9px;
    border-radius: 999px;
    background: #eef3fb;
    color: #52627c;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .pick-new .discovery-badge {
    background: #e8f1ff;
    color: #275fbf;
  }

  .pick-rediscover .discovery-badge {
    background: #f3ecff;
    color: #7548b8;
  }

  .pick-random .discovery-badge {
    background: #fff3dc;
    color: #a45b06;
  }

  .pick-surprise .discovery-badge {
    background: #e7f8f2;
    color: #147657;
  }

  .surprise-area {
    margin-top: 18px;
    padding: 18px;
    background: rgba(236, 250, 246, 0.72);
    border: 1px dashed #9ed9c5;
    border-radius: 18px;
  }

  .surprise-caption {
    margin-bottom: 10px;
    color: #3d7664;
    font-size: 12px;
    font-weight: 750;
  }

  #surpriseCard {
    max-width: 760px;
  }

  #surpriseCard .catalog-card { min-height: 0; }

  .catalog-section-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin: 0 2px 16px;
  }

  .catalog-section-heading .section-kicker { color: #8a94a6; }

  @media (max-width: 900px) {
    .discovery-grid { grid-template-columns: 1fr; }
    .discovery-card { min-height: 0; }
  }

  @media (max-width: 700px) {
    .discovery-section {
      margin-bottom: 32px;
      padding: 19px 15px;
      border-radius: 19px;
    }

    .discovery-heading {
      align-items: stretch;
      flex-direction: column;
      gap: 14px;
    }

    .discovery-title,
    .catalog-section-title { font-size: 21px; }

    .surprise-button { width: 100%; }
    .catalog-section-heading { margin-bottom: 13px; }
    .surprise-area { padding: 12px; }
  }
</style>
